<script>
// A dokumentáció szövege nyelvenként külön fájlban van (en.html / hu.html); a tartalomjegyzék a címsorokból készül
(async () => {
  const body = document.getElementById('docBody'), toc = document.getElementById('toc');
  body.innerHTML = await (await fetch(`${SITE_LANG}.html`)).text();

  const items = [...body.querySelectorAll('section[id] > h1, section[id] > h2, h3[id]')].map((h) => {
    const id = h.id || h.parentElement.id;
    const a = document.createElement('a');
    a.href = '#' + id; a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'toc-sub';
    toc.append(a);
    return { a, el: h.id ? h : h.parentElement };
  });

  // aktív szakasz kiemelése görgetéskor
  const spy = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) {
      items.forEach((it) => it.a.classList.toggle('on', it.el === e.target));
    }
  }, { rootMargin: '-80px 0px -70% 0px' });
  items.forEach((it) => spy.observe(it.el));
  // mobilon a tartalomjegyzék csukva indul, és kattintás után becsukódik
  const box = document.getElementById('tocBox');
  if (matchMedia('(max-width: 900px)').matches) box.open = false;
  toc.addEventListener('click', () => { if (matchMedia('(max-width: 900px)').matches) box.open = false; });

  // másolás gomb a kódblokkokhoz (a diagram kivételével)
  for (const pre of body.querySelectorAll('pre:not(.diagram)')) {
    const b = document.createElement('button');
    b.className = 'copy'; b.textContent = t('Copy');
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(pre.querySelector("code").textContent); b.textContent = t('Copied'); } catch { b.textContent = t('Select & copy'); }
      setTimeout(() => { b.textContent = t('Copy'); }, 1600);
    });
    pre.classList.add('has-copy'); pre.append(b);
  }

  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
})();
</script>
